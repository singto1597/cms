version: '3'

services:
  devdb:
    image: postgres:15
    user: "1000:1000"
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - "./pg_data:/var/lib/postgresql/data"
    networks:
      - cms-net

  devcms:
    build: ..
    container_name: cms_core
    user: "0:0"
    depends_on:
      - "devdb"
    environment:
      CMS_CONFIG: /home/cmsuser/cms/etc/cms-devdb.toml
    volumes:
      - "..:/home/cmsuser/src"
      - ../config-data:/home/cmsuser/cms/etc
      - cms_static_files:/home/cmsuser/src/cms/server/static
    privileged: true
    cgroup: host
    networks:
      - cms-net
    command: >
      bash -c "
        cp -Rf /home/cmsuser/src/config-data/. /home/cmsuser/cms/etc/
        # ตรงนี้อาจจะต้องเปลี่ยนเป็นคำสั่งรัน cmsResourceService ในอนาคต
        # แต่ตอนนี้ tail -f ไว้ก่อนตามสไตล์ dev
        tail -f /dev/null
      "

  nginx:
    image: nginx:alpine
    container_name: cms_gateway
    depends_on:
      - devcms
    ports:
      - "8888:80"
      - "8889:8889"
    volumes:
      - ../config-data/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../config-data/nginx/sites-available:/etc/nginx/sites-available:ro
      # *** สำคัญ: รับไฟล์ Static ที่แชร์มาจาก CMS ***
      - cms_static_files:/var/www/static:ro
      - ../config-data/html:/var/www/html:ro

      - ../my_static:/var/www/static:ro
    networks:
      - cms-net

# สร้าง Volume กลางไว้แชร์ไฟล์
volumes:
  cms_static_files:

# สร้าง Network ให้คุยกัน
networks:
  cms-net:
