services:
  devdb:
    image: docker.io/postgres:15
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - "devdb_data:/var/lib/postgresql/data"

  devcms:
    build: ..
    user: "0:0"
    depends_on:
      - "devdb"
    environment:
      CMS_CONFIG: /home/cmsuser/cms/etc/cms-devdb.toml
    volumes:
      - "..:/home/cmsuser/src"
    privileged: true
    cgroup: host
    command: ["tail", "-f", "/dev/null"]
    ports:
      - 8888:8888
      - 8889:8889
      - 8890:8890

volumes:
  devdb_data:
