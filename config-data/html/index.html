<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contest Selector | เลือกการแข่งขัน</title>
  <style>
    :root {
      --main-red: #d9463e;
      --light-red: #fff5f5;
      --border-red: #f1c4c4;
      --hover-red: #ffe8e8;
      --text-red: #c7372c;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 40px 0 80px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #2b2b2b;
      min-height: 100vh;
      position: relative;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 25px;
      font-weight: 600;
      color: var(--main-red);
      letter-spacing: 0.5px;
    }

    .container {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 28px rgba(217, 70, 62, 0.08);
      padding: 25px 30px;
      width: 90%;
      max-width: 480px;
      border-top: 5px solid var(--main-red);
      transition: transform 0.2s;
    }

    .container:hover {
      transform: translateY(-2px);
    }

    .group, .subgroup {
      margin-bottom: 14px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--light-red);
      border: 1px solid var(--border-red);
      transition: box-shadow 0.25s;
    }

    .group:hover, .subgroup:hover {
      box-shadow: 0 3px 12px rgba(217, 70, 62, 0.12);
    }

    .group-header, .subgroup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 14px 18px;
      font-weight: 500;
      font-size: 1.05rem;
      background: #fff;
      color: var(--text-red);
      transition: background 0.25s, color 0.25s;
    }

    .group-header:hover, .subgroup-header:hover {
      background: var(--hover-red);
    }

    .arrow {
      transition: transform 0.3s;
    }

    .group.open > .group-header .arrow,
    .subgroup.open > .subgroup-header .arrow {
      transform: rotate(90deg);
    }

    .contest-list, .subcontest-list {
      display: none;
      flex-direction: column;
      background: var(--light-red);
      border-top: 1px solid var(--border-red);
      animation: fadeIn 0.25s ease;
      overflow: hidden;
    }

    .group.open > .contest-list,
    .subgroup.open > .subcontest-list {
      display: flex;
    }

    .contest {
      padding: 12px 20px;
      text-decoration: none;
      color: #333;
      transition: background 0.25s, transform 0.1s;
      font-size: 0.95rem;
    }

    .contest:hover {
      background: var(--hover-red);
      transform: translateX(3px);
    }

    /* --- ย่อหน้าให้ subgroup ดูแยกจาก group หลัก --- */
    .subgroup {
      margin: 10px 15px;
      background: #fffafa;
    }

    .admin-link {
      display: block;
      text-align: center;
      margin: 16px 18px 18px 18px;
      padding: 9px 0;
      border-radius: 8px;
      background: #f6f6f6;
      color: #999;
      text-decoration: none;
      font-weight: 400;
      font-size: 0.9rem;
      border: 1px solid #e5e5e5;
      transition: background 0.3s, color 0.3s;
    }

    .admin-link:hover {
      background: #ececec;
      color: #666;
    }

    .credit {
      position: absolute;
      bottom: 10px;
      font-size: 0.75rem;
      color: #aaa;
      text-align: center;
      letter-spacing: 0.3px;
      user-select: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>Choose the contests</h1>

  <div class="container">

    <!-- Group ม.1 -->
    <div class="group">
      <div class="group-header" onclick="toggleGroup(this)">
        ม.1 <span class="arrow">▶</span>
      </div>
      <div class="contest-list">

        <!-- Subgroup เทอม 1 -->
        <div class="subgroup">
          <div class="subgroup-header" onclick="toggleGroup(this)">
            เทอม 1 <span class="arrow">▶</span>
          </div>
          <div class="subcontest-list">
            <a class="contest" target="_blank" href="/m1-t1-work/">งาน</a>
            <a class="contest" target="_blank" href="/m1-t1-mid/">กลางภาค</a>
            <a class="contest" target="_blank" href="/m1-t1-final/">ปลายภาค</a>
          </div>
        </div>

        <!-- Subgroup เทอม 2 -->
        <div class="subgroup">
          <div class="subgroup-header" onclick="toggleGroup(this)">
            เทอม 2 <span class="arrow">▶</span>
          </div>
          <div class="subcontest-list">
            <a class="contest" target="_blank" href="/m1-t2-work/">งาน</a>
            <a class="contest" target="_blank" href="/m1-t2-mid/">กลางภาค</a>
            <a class="contest" target="_blank" href="/m1-t2-final/">ปลายภาค</a>
          </div>
        </div>

      </div>
    </div>

    <!-- Group ม.2 -->
    <div class="group">
      <div class="group-header" onclick="toggleGroup(this)">
        ม.2 <span class="arrow">▶</span>
      </div>
      <div class="contest-list">

        <!-- Subgroup เทอม 1 -->
        <div class="subgroup">
          <div class="subgroup-header" onclick="toggleGroup(this)">
            เทอม 1 <span class="arrow">▶</span>
          </div>
          <div class="subcontest-list">
            <a class="contest" target="_blank" href="/m2-t1-work/">งาน</a>
            <a class="contest" target="_blank" href="/m2-t1-mid/">กลางภาค</a>
            <a class="contest" target="_blank" href="/m2-t1-final/">ปลายภาค</a>
          </div>
        </div>

      </div>
    </div>

    <!-- Group Teacher -->
    <div class="group">
      <div class="group-header" onclick="toggleGroup(this)">
        TEACHER_ONLY <span class="arrow">▶</span>
      </div>
      <div class="contest-list">
        <a class="contest" target="_blank" href="/teacher-only/">TEACHER_ONLY</a>
        <a href="/admin/" target="_blank" class="admin-link">เข้าสู่ระบบแอดมิน</a>
      </div>
    </div>

  </div>

  <div class="credit">Created by Phatthanaphon Sutham</div>

  <script>
    function toggleGroup(el) {
      const parent = el.parentElement;
      parent.classList.toggle("open");
    }
  </script>
</body>
</html>
