<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เลือกการแข่งขัน | Contest Selector</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 40px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #333;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      font-weight: 600;
      color: #2f3640;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 20px 30px;
      width: 90%;
      max-width: 480px;
    }

    .group {
      margin-bottom: 10px;
      border-radius: 12px;
      overflow: hidden;
      background: #f9fafc;
      border: 1px solid #e6e9ef;
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 14px 18px;
      font-weight: 500;
      font-size: 1.1rem;
      background: #ffffff;
      transition: background 0.25s;
    }

    .group-header:hover {
      background: #f1f3f6;
    }

    .arrow {
      transition: transform 0.3s;
    }

    .group.open .arrow {
      transform: rotate(90deg);
    }

    .contest-list {
      display: none;
      flex-direction: column;
      background: #f9fafc;
      padding-left: 10px;
      border-top: 1px solid #e6e9ef;
      animation: fadeIn 0.25s ease;
    }

    .group.open .contest-list {
      display: flex;
    }

    .contest {
      padding: 10px 18px;
      text-decoration: none;
      color: #333;
      border-radius: 8px;
      transition: background 0.25s, transform 0.1s;
      font-size: 0.98rem;
    }

    .contest:hover {
      background: #eef1f7;
      transform: translateX(3px);
    }

    .admin-link {
      display: block;
      text-align: center;
      margin-top: 25px;
      padding: 10px 0;
      border-radius: 8px;
      background: #2f3640;
      color: white;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.3s, transform 0.15s;
    }

    .admin-link:hover {
      background: #414b57;
      transform: translateY(-2px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>เลือกการแข่งขัน</h1>

  <div class="container">

    <div class="group">
      <div class="group-header" onclick="toggleGroup(this)">
        ม.1 <span class="arrow">▶</span>
      </div>
      <div class="contest-list">
        <a class="contest" href="/m1-term1/">เทอม 1</a>
        <a class="contest" href="/m1-term2/">เทอม 2</a>
        <a class="contest" href="/m1-exam/">สอบ</a>
      </div>
    </div>

    <div class="group">
      <div class="group-header" onclick="toggleGroup(this)">
        ม.2 <span class="arrow">▶</span>
      </div>
      <div class="contest-list">
        <a class="contest" href="/m2-term1/">เทอม 1</a>
        <a class="contest" href="/m2-term2/">เทอม 2</a>
        <a class="contest" href="/m2-exam/">สอบ</a>
      </div>
    </div>

    <div class="group">
      <div class="group-header" onclick="toggleGroup(this)">
        ม.3 <span class="arrow">▶</span>
      </div>
      <div class="contest-list">
        <a class="contest" href="/m3-term1/">เทอม 1</a>
        <a class="contest" href="/m3-term2/">เทอม 2</a>
        <a class="contest" href="/m3-exam/">สอบ</a>
      </div>
    </div>

    <a href="/admin/" class="admin-link">เข้าสู่ระบบแอดมิน</a>
  </div>

  <script>
    function toggleGroup(el) {
      const group = el.parentElement;
      group.classList.toggle("open");
    }
  </script>
</body>
</html>
