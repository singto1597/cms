<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เลือกการแข่งขัน | Contest Selector</title>
  <style>
    :root {
      --main-red: #d9463e;
      --light-red: #fff5f5;
      --border-red: #f1c4c4;
      --hover-red: #ffe8e8;
      --text-red: #c7372c;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 40px 0 80px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #2b2b2b;
      min-height: 100vh;
      position: relative;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 25px;
      font-weight: 600;
      color: var(--main-red);
      letter-spacing: 0.5px;
    }

    .container {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 8px 28px rgba(217, 70, 62, 0.08);
      padding: 25px 30px;
      width: 90%;
      max-width: 480px;
      border-top: 5px solid var(--main-red);
      transition: transform 0.2s;
    }

    .container:hover {
      transform: translateY(-2px);
    }

    .group {
      margin-bottom: 16px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--light-red);
      border: 1px solid var(--border-red);
      transition: box-shadow 0.25s;
    }

    .group:hover {
      box-shadow: 0 3px 12px rgba(217, 70, 62, 0.12);
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 14px 18px;
      font-weight: 500;
      font-size: 1.1rem;
      background: #fff;
      color: var(--text-red);
      transition: background 0.25s, color 0.25s;
    }

    .group-header:hover {
      background: var(--hover-red);
    }

    .arrow {
      transition: transform 0.3s;
    }

    .group.open .arrow {
      transform: rotate(90deg);
    }

    .contest-list {
      display: none;
      flex-direction: column;
      background: var(--light-red);
      border-top: 1px solid var(--border-red);
      animation: fadeIn 0.25s ease;
      overflow: hidden; 
    }

    .group.open .contest-list {
      display: flex;
    }

    .contest {
      padding: 15px 18px;
      text-decoration: none;
      color: #333;
      border-radius: 8px;
      transition: background 0.25s, transform 0.1s;
      font-size: 0.95rem;
      
    }

    .contest:hover {
      background: var(--hover-red);
      transform: translateX(3px);
    }

    .admin-link {
      display: block;
      text-align: center;
      margin: 16px 18px 18px 18px;
      padding: 9px 0;
      border-radius: 8px;
      background: #f6f6f6;
      color: #999;
      text-decoration: none;
      font-weight: 400;
      font-size: 0.9rem;
      border: 1px solid #e5e5e5;
      transition: background 0.3s, color 0.3s;
    }

    .admin-link:hover {
      background: #ececec;
      color: #666;
    }

    .credit {
      position: absolute;
      bottom: 10px;
      font-size: 0.75rem;
      color: #aaa;
      text-align: center;
      letter-spacing: 0.3px;
      user-select: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <h1>เลือกการแข่งขัน</h1>

  <div class="container">

    <div class="group">
      <div class="group-header" onclick="toggleGroup(this)">
        ม.2 <span class="arrow">▶</span>
      </div>
      <div class="contest-list">
        <a class="contest" href="/m2-term1/">Term 1</a>
        <a class="contest" href="/m2-mid-exam/">Midterm Exam</a>
        <a class="contest" href="/m2-exam/">Final Exam</a>
      </div>
    </div>

    <div class="group">
      <div class="group-header" onclick="toggleGroup(this)">
        TEACHER_ONLY <span class="arrow">▶</span>
      </div>
      <div class="contest-list">
        <a class="contest" href="/teacher-test-contest-1/">Test contest 1</a>
        
        <a href="/admin/" class="admin-link">เข้าสู่ระบบแอดมิน</a>
      </div>
    </div>

  </div>

  <div class="credit">Created by Phatthanaphon</div>

  <script>
    function toggleGroup(el) {
      const group = el.parentElement;
      group.classList.toggle("open");
    }
  </script>
</body>
</html>
