# 1. สร้างกลุ่ม Upstream (Load Balancer)
upstream cms_cluster {
    # เลือกวิธีการกระจายงาน (least_conn = ส่งให้คนที่งานน้อยสุด)
    least_conn;
    
    server devcms:9501;
    server devcms:9502;
    server devcms:9503;
    server devcms:9504;
}

server {
    listen 80 default_server;
    # listen [::]:80 default_server; # ถ้าไม่ได้ใช้ IPv6 ก็ comment ไว้ก่อนก็ได้

    # 2. ตั้งค่าการส่งต่อ (Proxy Pass)
    location / {
        proxy_pass http://cms_cluster;
        
        # ส่ง Header ที่จำเป็นไปให้ CMS รู้ตัวตนคนเข้า
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # รองรับ Web Socket (สำหรับ Live Scoreboard)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ส่วน Static file ยังเหมือนเดิม
    location /static {
        alias /var/www/static;
        expires 30d;
    }
}
server {
    listen 8889;
    
    # ส่งต่อให้ AdminWebServer (ที่รันอยู่ใน container ชื่อ devcms)
    location / {
        proxy_pass http://devcms:8889;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ใช้ Static File ก้อนเดียวกับที่เราทำรวมร่างไว้ (Admin ก็ต้องใช้ CSS นะ!)
    location /static {
        alias /var/www/static;
        expires 30d;
    }
}
