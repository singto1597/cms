server {
    listen 80 default_server;
    listen [::]:80 default_server;

    location /static {
        alias /var/www/static; 
        expires 30d;
    }

    location / {
        root /var/www/html;
        index index.html;
    }

    location /m1-t1-work/ {
        proxy_pass http://devcms:9501/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /m1-t1-mid/ {
